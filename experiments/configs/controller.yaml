# FROZEN v2 -- see EXPERIMENT_PROTOCOL.md section 2.
# NOTE v2: the admissibility threshold is no longer a hand-set R_safe. It is
# tau_hat, calibrated by conformal risk control against the level delta in
# calibration.yaml. The value below is the SEARCH GRID, not the threshold.
tick_ms: 500
tau_grid: [0.02, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.40, 0.50]
U_max: 0.25
decision_deadline_ms: 100     # p95 budget; a miss is a recorded fallback
fallback_action: NO_OP
rollout_horizon_H: null       # = Delta / tick_ms, set once Delta is frozen
